session: wordbattle

windows:
  - name: local
    root: ~

  - name: nodejs-shell
    root: ~
    commands:
      - node

  - name: server-claude
    root: ~/development/word-battle-server
    commands:
      - claude

  - name: server-gemini
    root: ~/development/word-battle-server
    commands:
      - gemini

  - name: client-claude
    root: ~/development/word-battle-client
    commands:
      - claude

  - name: client-gemini
    root: ~/development/word-battle-client
    commands:
      - gemini
