# Toolbar active tab foreground and background color
set -g window-status-current-style "fg=white,bg=black"
# Toolbar inactive tab foreground and background color
set-window-option -g window-status-style "bg=colour240"
# Toolbar remove date and host
set -g status-right ""
# Scroll up in split pane
set -g mouse on

# "a" will synchronize typing in split panes
bind-key a setw synchronize-panes
